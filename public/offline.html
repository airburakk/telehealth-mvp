<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Çevrimdışı — AURA</title>
  <style>
    /* Renkler globals.css GECE token'larının sabit karşılığıdır (iç yüzey gece varsayılan, v6.22):
       --c-bg #0d0e10 · --c-panel #161719 · --c-ink #f4f5f3 · --c-ink-2 #9a9c99
       --c-hairline rgba(255,255,255,.09) · --c-accent #28c8d8 · --c-accent-strong #1fa9b8
       🪤 Burada var(--c-*) KULLANILAMAZ: bu sayfa çevrimdışı servis edilir, globals.css yüklenmez
       → değişkenler çözülmez, renkler boşa düşerdi. Token değişirse burası ELLE güncellenir.
       (2026-08-19'a kadar eski marka tonu #14C3D0 + gündüz kart duruyordu; PWA kabuğu React
       ağacının dışında olduğu için ne derleyici ne test bu sürüklenmeyi görür.) */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; background: #0d0e10; color: #f4f5f3; }
    .card { text-align: center; padding: 40px 28px; background: #161719; border: 1px solid rgba(255,255,255,.09); border-radius: 20px; max-width: 360px; margin: 20px; }
    .logo { width: 56px; height: 56px; border-radius: 14px; margin: 0 auto 14px; display: block; }
    h1 { font-size: 18px; font-weight: 600; color: #f4f5f3; margin: 0 0 6px; }
    p { font-size: 14px; line-height: 1.5; margin: 0 0 18px; color: #9a9c99; }
    button { background: #28c8d8; color: #0d0e10; border: 0; border-radius: 10px; padding: 10px 22px; font-size: 14px; font-weight: 600; cursor: pointer; }
    button:hover { background: #1fa9b8; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="/icon-192.png" alt="AURA" />
    <h1>İnternet bağlantısı yok</h1>
    <p>Sayfa yüklenemedi. Bağlantınızı kontrol edip tekrar deneyin — sağlık verileriniz güncel kalsın diye her zaman canlı sunucudan alınır.</p>
    <button id="retry">Tekrar dene</button>
  </div>
  <!-- Inline handler değil script: sıkı CSP'de (nonce/hash) statik dosya script'i sha256 ile
       allowlist'lenebilir; onclick attribute'u ise ancak 'unsafe-hashes' ile kurtarılırdı. -->
  <script>document.getElementById("retry").addEventListener("click", function () { location.reload(); });</script>
</body>
</html>
